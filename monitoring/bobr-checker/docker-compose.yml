services:
  checker:
    image: kutovoys/xray-checker:latest
    container_name: bobr-cloud-checker
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-2112}:2112"
    volumes:
      - ./geo:/app/geo
      - ./custom:/app/custom:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:2112/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    stop_grace_period: 30s
