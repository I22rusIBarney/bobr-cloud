name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Синтаксис скриптов кабинета и админки
        run: |
          python - <<'PY'
          import re, pathlib
          for f in ("cabinet", "admin"):
              s = pathlib.Path(f"app/web/{f}.html").read_text()
              js = max(re.findall(r"<script>(.*?)</script>", s, re.S), key=len)
              pathlib.Path(f"/tmp/{f}.js").write_text(js)
          PY
          node --check /tmp/cabinet.js
          node --check /tmp/admin.js
          node --check app/web/static/ui.js
      - run: pytest -q

  # Готовый образ для серверов: только с main и только если тесты прошли.
  # bcloud update скачивает ghcr.io/<владелец>/<репозиторий>:sha-<коммит> вместо сборки на VPS.
  image:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Имя образа
        run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMG }}:latest
            ${{ env.IMG }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
