name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Синтаксис скриптов кабинета и админки
        run: |
          python - <<'PY'
          import re, pathlib
          for f in ("cabinet", "admin"):
              s = pathlib.Path(f"app/web/{f}.html").read_text()
              js = max(re.findall(r"<script>(.*?)</script>", s, re.S), key=len)
              pathlib.Path(f"/tmp/{f}.js").write_text(js)
          PY
          node --check /tmp/cabinet.js
          node --check /tmp/admin.js
          node --check app/web/static/ui.js
      - name: Тесты
        # упавшие проверки — ещё и аннотацией: её видно через API без скачивания логов
        run: |
          set -o pipefail
          pytest -q -rA 2>&1 | tee /tmp/pytest.out || {
            { grep -E 'FAIL ' /tmp/pytest.out | grep -v PASS | head -20; echo ----; grep -v ' PASS ' /tmp/pytest.out | tail -50; } \
              | cut -c1-400 | python3 -c 'import sys; print("::error::" + sys.stdin.read().replace("%", "%25").replace("\n", "%0A"))'
            exit 1; }

  # Готовый образ для серверов: только с main и только если тесты прошли.
  # bcloud update скачивает ghcr.io/<владелец>/<репозиторий>:sha-<коммит> вместо сборки на VPS.
  image:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Имя образа
        run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMG }}:latest
            ${{ env.IMG }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Образ доступен серверам без логина
        run: |
          tok=$(curl -fsS "https://ghcr.io/token?scope=repository:${IMG#ghcr.io/}:pull" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("token",""))' || true)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $tok" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${IMG#ghcr.io/}/manifests/sha-${GITHUB_SHA}")
          if [ "$code" = 200 ]; then echo "Образ публичный — bcloud update скачает его"; else
            echo "::warning::Пакет ${IMG} приватный (HTTP $code): серверы не смогут его скачать и будут собирать сами. Откройте Packages → bobr-cloud → Package settings → Change visibility → Public."
          fi
