<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cloud</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/ui.css">
<style>
  :root { --tabbar-h: 60px; }
  .tabbar { height: calc(var(--tabbar-h) + var(--sab)); }
  .hidden-tabbar .tabbar { display: none; }
  body.hidden-tabbar { padding-bottom: calc(24px + var(--sab)); }
  .pill.bal svg { width: 16px; height: 16px; color: var(--accent-text); }

  /* ── Профиль: пользователь и баланс ── */
  .user-card { display: flex; align-items: center; gap: 14px; margin: 2px var(--gutter) 18px; min-width: 0; }
  .user-card .who { min-width: 0; flex: 1; }
  .user-card .who b { display: block; font: 700 21px/1.2 var(--font-display); letter-spacing: -0.4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-card .id { border: 0; background: none; padding: 2px 0; color: var(--hint); font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; max-width: 100%; }
  .user-card .id span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-card .id svg { width: 13px; height: 13px; flex: none; opacity: .7; }

  .hero-card {
    position: relative; margin: 0 var(--gutter) 22px; padding: 20px 18px 18px; border-radius: var(--r-xl); overflow: hidden; isolation: isolate;
    background:
      radial-gradient(120% 95% at 100% 0%, rgba(67, 140, 255, .30), transparent 58%),
      radial-gradient(80% 70% at 0% 110%, rgba(139, 140, 255, .14), transparent 60%),
      linear-gradient(160deg, #272C36, #1E2128);
    box-shadow: var(--shadow-card), inset 0 0 0 1px rgba(120, 165, 255, .16);
  }
  .hero-card::before { /* тонкая сетка — технологичный акцент */
    content: ""; position: absolute; inset: 0; z-index: -1; opacity: .5;
    background: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 22px 22px, linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 22px 22px;
    -webkit-mask: radial-gradient(90% 90% at 100% 0%, #000, transparent 70%); mask: radial-gradient(90% 90% at 100% 0%, #000, transparent 70%);
  }
  .hero-card .lbl { font-size: 13px; font-weight: 600; color: #AEB9CC; display: flex; align-items: center; gap: 8px; }
  .hero-card .lbl svg { width: 16px; height: 16px; color: var(--accent-text); }
  .hero-card .big { font: 700 44px/1.05 var(--font-display); letter-spacing: -1.6px; margin: 10px 0 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hero-card .meta { font-size: 14px; color: #A3ACBD; line-height: 1.4; }
  .hero-card .meta b { color: var(--text); font-weight: 600; }
  .hero-card .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .hero-card .tags:empty { display: none; }

  /* ── Пригласить друга ── */
  .ref-card {
    position: relative; margin: 0 var(--gutter) 22px; padding: 16px 16px 16px; border-radius: var(--r-xl); overflow: hidden; isolation: isolate;
    background:
      radial-gradient(110% 90% at 100% 0%, rgba(52, 211, 153, .20), transparent 55%),
      radial-gradient(80% 80% at 0% 110%, rgba(67, 140, 255, .10), transparent 60%),
      linear-gradient(160deg, #222A2B, #1D2126);
    box-shadow: var(--shadow-card), inset 0 0 0 1px rgba(52, 211, 153, .16);
  }
  .ref-card .head { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .ref-card .head > div { flex: 1; min-width: 0; }
  .ref-card .head b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
  .ref-card .head span { display: block; font-size: 13px; line-height: 1.35; color: #A1B0AC; margin-top: 1px; }
  .ref-card .head .icon-btn { color: #A1B0AC; margin: -8px -8px -8px 0; }
  .ref-card .earned { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 0; }
  .ref-card .earned b { font: 700 32px/1.1 var(--font-display); letter-spacing: -1px; color: var(--ok); font-variant-numeric: tabular-nums; }
  .ref-card .earned span { font-size: 13px; color: #A1B0AC; }
  .ref-card .bar { margin-top: 12px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .07); }
  .ref-card .bar i { background: linear-gradient(90deg, #1FAF7A, var(--ok)); box-shadow: 0 0 12px rgba(52, 211, 153, .55); }
  .ref-card .cnt { font-size: 12px; color: #A1B0AC; margin-top: 7px; }
  .ref-card .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .ref-card .two .btn { min-height: 44px; font-size: 15px; background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1); color: var(--text); }
  .ref-card .two .btn svg { width: 18px; height: 18px; }
  .ref-card .two .btn.primary { background: rgba(52, 211, 153, .16); box-shadow: inset 0 0 0 1px rgba(52, 211, 153, .35); color: #7BE8BF; }

  /* ── Пополнение ── */
  .save-card { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0 14px; }
  .save-card button { border: 0; background: none; padding: 0; cursor: pointer; }
  .save-card span { font-size: 13px; line-height: 18px; color: var(--hint); }
  .prov-list { display: grid; gap: 8px; margin: 12px 0 14px; }
  .prov-list + .save-card { margin-top: 0; }
  .prov-list button {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 0; border-radius: var(--r-md); cursor: pointer; text-align: left; color: var(--text);
    background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); font-size: 15px; font-weight: 500;
    transition: box-shadow var(--t-fast) var(--ease), background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
  }
  .prov-list button:active { transform: scale(.98); }
  .prov-list .radio { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--hint-2); flex: none; transition: box-shadow var(--t) var(--ease-spring); }
  .prov-list button[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .prov-list button[aria-pressed="true"] .radio { box-shadow: inset 0 0 0 6px var(--accent); }
  .pay-note { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 12px; color: var(--hint); margin-top: 12px; }
  .pay-note svg { width: 14px; height: 14px; color: var(--ok); }

  /* ── Мини-история ── */
  .tx { display: flex; align-items: center; gap: 12px; padding: 11px 16px; position: relative; }
  .tx + .tx::before { content: ""; position: absolute; top: 0; left: 62px; right: 0; height: 1px; background: var(--sep); }
  .tx .grow { flex: 1; min-width: 0; }
  .tx .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx .s { font-size: 13px; color: var(--hint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .tx .amt { text-align: right; flex: none; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tx .amt.in { color: var(--ok); }
  .tx .amt a { display: block; font-size: 12px; font-weight: 500; margin-top: 2px; }

  /* ── Серверы ── */
  .server-card {
    display: block; width: calc(100% - 2 * var(--gutter)); text-align: left; border: 0; color: inherit; cursor: pointer;
    margin: 0 var(--gutter) 10px; padding: 14px 16px 14px; background: var(--cell); border-radius: var(--r-lg);
    box-shadow: var(--shadow-card), inset 0 0 0 1px var(--line); transition: transform var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
  }
  .server-card:active { transform: scale(.985); background: #262A32; }
  .server-card .top { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .server-card .flag-tile { width: 40px; height: 40px; font-size: 24px; border-radius: 13px; }
  .server-card .name { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .server-card .ip { font: 13px/1.4 var(--mono); color: var(--hint); }
  .specs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .spec-chip { font-size: 12px; font-weight: 600; color: #B7BDC8; background: var(--surface-2); padding: 5px 9px; border-radius: 8px; display: inline-flex; gap: 5px; align-items: center; }
  .spec-chip svg { width: 13px; height: 13px; color: var(--hint); }
  .term { margin-top: 12px; }
  .bar { height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent-lo), var(--accent-hi)); transition: width .5s var(--ease-out); }
  .bar.warn i { background: var(--warn); } .bar.bad i { background: var(--danger); }
  .term-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--hint); margin-top: 7px; }

  .hero { margin: 4px var(--gutter) 20px; display: flex; align-items: center; gap: 14px; min-width: 0; }
  .hero .flag-tile { width: 58px; height: 58px; font-size: 32px; border-radius: 18px; background: var(--cell); box-shadow: inset 0 0 0 1px var(--line); }
  .hero h1 { font: 700 24px/1.2 var(--font-display); letter-spacing: -0.5px; margin: 0 0 6px; word-break: break-all; }
  .power { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 var(--gutter) 22px; }
  .power button {
    display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 12px; border: 0; border-radius: var(--r-lg);
    background: var(--cell); box-shadow: var(--shadow-card), inset 0 0 0 1px var(--line); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
    transition: transform var(--t-fast) var(--ease), background var(--t-fast);
  }
  .power button span { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); }
  .power button:nth-child(3) span { background: var(--danger-soft); color: var(--danger); }
  .power button:active { transform: scale(.96); background: #262A32; }
  .power button svg { width: 20px; height: 20px; }
  .power button[disabled] { color: var(--hint-2); pointer-events: none; }
  .power button[disabled] span { opacity: .4; }

  /* ── Конструктор ── */
  .loc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .loc {
    position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 14px 14px 13px; border: 0; text-align: left; cursor: pointer; color: inherit; min-width: 0;
    background: var(--cell); border-radius: var(--r-lg); box-shadow: var(--shadow-card), inset 0 0 0 1px var(--line);
    transition: transform var(--t-fast) var(--ease), box-shadow var(--t) var(--ease), background var(--t) var(--ease);
  }
  .loc:active { transform: scale(.96); }
  .loc .f { font-size: 28px; line-height: 1; margin-bottom: 8px; }
  .loc b { font-size: 15px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .loc .from { font-size: 13px; color: var(--hint); font-variant-numeric: tabular-nums; }
  .loc[aria-pressed="true"] {
    background: linear-gradient(160deg, rgba(67, 140, 255, .18), rgba(67, 140, 255, .04) 70%), var(--cell);
    box-shadow: 0 12px 30px -14px rgba(67, 140, 255, .8), inset 0 0 0 1.5px var(--accent);
  }
  .tick { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; transform: scale(.3); opacity: 0; transition: transform var(--t) var(--ease-spring), opacity var(--t-fast); }
  .tick svg { width: 13px; height: 13px; }
  [aria-pressed="true"] > .tick { transform: none; opacity: 1; }

  .preset-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .preset {
    position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px; border: 0; text-align: left; cursor: pointer; color: inherit; min-width: 0;
    background: var(--cell); border-radius: var(--r-lg); box-shadow: var(--shadow-card), inset 0 0 0 1px var(--line);
    transition: transform var(--t-fast) var(--ease), box-shadow var(--t) var(--ease), background var(--t) var(--ease);
  }
  .preset:active { transform: scale(.96); }
  .preset .pname { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 6px; }
  .preset .pspec { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .preset .pdisk { font-size: 13px; color: var(--hint); }
  .announce { display: flex; gap: 12px; align-items: flex-start; margin: 0 var(--gutter) 16px; padding: 13px 14px; border-radius: var(--r-lg);
    background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; line-height: 1.4; }
  .announce.warn { background: var(--warn-soft); }
  .announce > svg { flex: none; width: 20px; height: 20px; margin-top: 1px; color: var(--accent-text); }
  .announce.warn > svg { color: var(--warn); }
  .announce p { margin: 0; flex: 1; white-space: pre-line; }
  .announce button { flex: none; border: 0; background: none; color: var(--hint); padding: 0 2px; font-size: 18px; line-height: 1; cursor: pointer; }
  .down-alert { margin: 0 var(--gutter) 16px; padding: 13px 14px; border-radius: var(--r-lg); background: var(--danger-soft); font-size: 14px; line-height: 1.4; }
  .down-alert b { color: var(--danger); }
  .log-item { display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; padding: 11px 16px; border-bottom: 1px solid var(--sep); }
  .log-item:last-child { border-bottom: 0; }
  .log-item .i { grid-row: span 2; font-size: 16px; line-height: 22px; }
  .log-item b { font-weight: 500; }
  .log-item span { color: var(--hint); font-size: 13px; }
  .howto pre { margin: 6px 0 0; padding: 10px 12px; border-radius: var(--r-md); background: var(--fill); font: 14px/1.4 var(--mono); white-space: pre-wrap; word-break: break-all; }
  .howto ol { margin: 6px 0 0; padding-left: 20px; }
  .howto li { margin: 4px 0; }
  .howto .step { padding: 13px 16px; border-bottom: 1px solid var(--sep); font-size: 15px; line-height: 1.45; }
  .howto .step:last-child { border-bottom: 0; }
  .preset .pspeed { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .preset .pprice { font: 700 18px/1.2 var(--font-display); letter-spacing: -0.3px; margin-top: auto; padding-top: 10px; font-variant-numeric: tabular-nums; }
  .preset .pprice small { font-size: 12px; font-weight: 500; color: var(--hint); letter-spacing: 0; }
  .preset[aria-pressed="true"] { background: linear-gradient(160deg, rgba(67, 140, 255, .16), rgba(67, 140, 255, .03) 70%), var(--cell); box-shadow: 0 12px 30px -16px rgba(67, 140, 255, .8), inset 0 0 0 1.5px var(--accent); }

  .period-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .period-grid button {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 11px 4px 10px; border: 0; cursor: pointer; color: inherit; min-width: 0;
    background: var(--cell); border-radius: var(--r-md); box-shadow: var(--shadow-card), inset 0 0 0 1px var(--line);
    transition: transform var(--t-fast) var(--ease), box-shadow var(--t) var(--ease), background var(--t) var(--ease);
  }
  .period-grid button:active { transform: scale(.95); }
  .period-grid b { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .period-grid span { font-size: 12px; color: var(--hint); white-space: nowrap; }
  .period-grid span.save { color: var(--ok); font-weight: 600; }
  .period-grid button[aria-pressed="true"] { background: linear-gradient(160deg, rgba(67, 140, 255, .18), rgba(67, 140, 255, .04) 70%), var(--cell); box-shadow: 0 10px 26px -14px rgba(67, 140, 255, .8), inset 0 0 0 1.5px var(--accent); }

  details.all-plans { margin-top: 10px; }
  details.all-plans summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--accent-text); padding: 8px; }
  details.all-plans summary::-webkit-details-marker { display: none; }
  details.all-plans summary svg { width: 7px; height: 12px; transform: rotate(90deg); transition: transform var(--t) var(--ease); }
  details.all-plans[open] summary svg { transform: rotate(-90deg); }
  details.all-plans .list { margin-top: 6px; animation: rise var(--t) var(--ease-out); }

  .builder { padding: 14px 16px 6px; }
  .readout { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 4px; }
  .readout > div { background: var(--surface-2); border-radius: var(--r-md); padding: 11px 11px 10px; box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow var(--t) var(--ease), background var(--t) var(--ease); min-width: 0; }
  .readout svg { width: 16px; height: 16px; color: var(--accent-text); display: block; }
  .readout b { display: block; font: 700 26px/1.1 var(--font-display); letter-spacing: -0.6px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .readout span { font-size: 12px; color: var(--hint); white-space: nowrap; }
  .readout .over { box-shadow: inset 0 0 0 1px var(--accent-ring); background: rgba(67, 140, 255, .08); }
  .spec { padding: 12px 0 12px; position: relative; }
  .spec + .spec::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--sep); }
  .spec-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-weight: 500; }
  .spec-h .v { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--hint-2); margin-top: 2px; padding: 0 4px; font-variant-numeric: tabular-nums; }
  .match-note { font-size: 13px; color: var(--hint); text-align: center; padding: 10px 8px 6px; min-height: 18px; transition: color var(--t); }
  .match-note.bad { color: var(--danger); }
  .match-note.ok { color: var(--ok); }

  .buybar {
    position: fixed; left: 0; right: 0; z-index: 16; bottom: calc(var(--tabbar-h) + var(--sab));
    padding: 12px var(--gutter); display: flex; align-items: center; gap: 14px;
    background: color-mix(in srgb, #1B1E24 86%, transparent); backdrop-filter: saturate(160%) blur(22px); -webkit-backdrop-filter: saturate(160%) blur(22px);
    border-top: 1px solid var(--line);
  }
  .buybar .price { flex: 0 1 auto; min-width: 0; line-height: 1.15; }
  .buybar .price b { display: block; font: 700 24px/1.15 var(--font-display); letter-spacing: -0.6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .buybar .price b small { font-size: 13px; font-weight: 500; color: var(--hint); letter-spacing: 0; }
  .buybar .price > span { display: block; font-size: 12px; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 44vw; }
  .buybar .btn { flex: 1; min-width: 0; }
  body.has-buybar { padding-bottom: calc(160px + var(--sab)); }
</style>
</head>
<body>
<div id="root"></div>
<nav class="tabbar" role="tablist" id="tabbar"></nav>
<script src="/static/ui.js"></script>
<script src="/static/fx.js"></script>
<script>
UI.init();
const { h, row, group, icon, rub } = UI;
const api = UI.api('/api/me');

const ST = {
  provisioning: { t: 'Создаётся', c: 'warn' }, active: { t: 'Работает', c: 'ok' },
  suspended: { t: 'Приостановлен', c: 'bad' }, expired: { t: 'Истёк', c: 'bad' },
};
let D = null, CAT = null, tab = 'servers';
const revealed = new Set();
const B = { loc: null, cpu: null, ram: null, disk: null, os: null, password: '', period: '1m' };
const LIVE = {}; // id → { power_status, conn_info, at }
const PW_RE = /^[\x21-\x7e]{8,64}$/;
let topupPrefill = null;

// ───────── оформление ─────────
const pref = { get(k) { try { return localStorage.getItem('bc_' + k); } catch (e) { return null; } }, set(k, v) { try { v === null ? localStorage.removeItem('bc_' + k) : localStorage.setItem('bc_' + k, v); } catch (e) {} } };
function applyTheme() {
  if (!D || !D.theme || !window.FX) return;
  const t = D.theme;
  const own = t.client_choice ? pref.get('bg') : null;
  const bg = own || t.bg;
  FX.background(bg, bg === 'image' ? t.image : null);
  FX.intensity(pref.get('fxlvl') || 'normal');
  FX.effect(pref.get('fx') === 'off' ? 'none' : t.effect);
}
function bgSwatch(name, image) {
  const dark = document.documentElement.dataset.scheme ? document.documentElement.dataset.scheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  if (name === 'image') return image ? `center / cover url("${image}")` : 'var(--fill)';
  const b = FX.BACKGROUNDS[name]; return b ? b[dark ? 'dark' : 'light'] : 'var(--bg)';
}
function appearanceView() {
  const t = D.theme;
  const cur = (t.client_choice && pref.get('bg')) || '';
  const v = h('div', {}, UI.nav.backLink('Профиль'), h('h1', { class: 'large-title' }, 'Оформление'));
  if (t.client_choice) {
    const opts = [['', 'Как у сервиса'], ...Object.keys(FX.BACKGROUNDS).map(k => [k, FX.BG_NAMES[k]])];
    if (t.image) opts.push(['image', 'Картинка сервиса']);

/* Опасное действие с кодом из бота (если включено в админке): fn(code) → Promise. */
async function withCode(s, action, what, fn, okText) {
  if (!D.confirm_codes) return UI.run(() => fn(null), okText).then(async r => { if (r !== undefined && okText) await refresh(); return r; });
  const sent = await UI.run(() => api(`/servers/${s.id}/code`, 'POST', { action }));
  if (sent === undefined) return undefined;
  return new Promise(resolve => {
    let done = false;
    const close = UI.sheet('Код подтверждения', closeFn => {
      const inp = h('input', { type: 'text', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: 6, placeholder: '000000', 'aria-label': 'Код из бота', style: 'font: 600 24px/1.2 var(--mono); letter-spacing: .3em; text-align:center' });
      const go = h('button', { class: 'btn danger', type: 'button', disabled: true }, 'Подтвердить ' + what);
      inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, ''); go.disabled = inp.value.length !== 6; });
      go.onclick = UI.busy(go, async () => {
        const r = await UI.run(() => fn(inp.value), okText);
        if (r === undefined) { inp.value = ''; go.disabled = true; return; }
        done = true; closeFn(); resolve(r); if (okText) await refresh();
      });
      setTimeout(() => inp.focus(), 350);
      return h('div', {}, h('section', { class: 'group' }, h('div', { class: 'list' }, h('label', { class: 'field stack' }, h('label', {}, 'Код из бота'), inp)),
        h('div', { class: 'group-f' }, `Мы отправили 6 цифр в чат с ботом — это защищает от случайного нажатия. Код действует 10 минут.`)),
        h('div', { style: 'margin:0 var(--gutter)' }, go));
    });
    const iv = setInterval(() => { if (!document.querySelector('.sheet')) { clearInterval(iv); if (!done) resolve(undefined); } }, 400);
  });
}

// ───────── Конструктор ─────────
function offersFor(loc) { const l = CAT && CAT.locations.find(x => x.code === loc); return l ? l.offers : []; }
const uniq = a => [...new Set(a)].sort((x, y) => x - y);
function axes(loc) { const o = offersFor(loc); return { cpu: uniq(o.map(x => x.cpu)), ram: uniq(o.map(x => x.ram)), disk: uniq(o.map(x => x.disk)) }; }
function snap(vals, v) { if (!vals.length) return null; if (v == null) return vals[0]; return vals.find(x => x >= v) ?? vals[vals.length - 1]; }
function match() {
  const c = offersFor(B.loc).filter(o => o.cpu >= B.cpu && o.ram >= B.ram && o.disk >= B.disk);
  c.sort((a, b) => a.price_kop - b.price_kop || (a.cpu + a.ram + a.disk) - (b.cpu + b.ram + b.disk));
  return c[0] || null;
}
function nearestFix() { // что уменьшить, если такой конфигурации нет
  const o = offersFor(B.loc);
  for (const [k, name] of [['disk', 'диск'], ['ram', 'память'], ['cpu', 'процессоры']]) {
    const alt = o.filter(x => ['cpu', 'ram', 'disk'].every(a => a === k || x[a] >= B[a]));
    if (alt.length) return `Уменьшите ${name} — тарифа с таким сочетанием нет.`;
  }
  return 'Тарифа с таким сочетанием нет — уменьшите параметры.';
}
/* Готовые пресеты из тарифов локации: самый доступный, самый мощный и равномерно между ними. */
const PRESET_NAMES = ['Starter', 'Basic', 'Standard', 'Performance'];
function presetsFor(loc) {
  const o = [...offersFor(loc)].sort((a, b) => a.price_kop - b.price_kop);
  if (o.length <= 4) return o.map((x, i) => ({ ...x, pname: PRESET_NAMES[i] }));

function ticketView(id) {
  const v = h('div', {}, UI.nav.backLink('Поддержка'), group(null, [h('div', { class: 'skeleton' })]));
  const draw = t => {

      h('div', { style: 'margin:4px var(--gutter) 14px' },
        h('div', { style: 'font-size:22px;font-weight:700;letter-spacing:.35px;line-height:28px' }, t.subject),

          h('span', { class: 'badge ' + c }, st), '№ ' + t.id, t.server ? h('span', {}, t.server.flag + ' ' + t.server.name) : null)),
      UI.chat(t.messages, ['client'], { admin: 'Поддержка' })];
    if (t.status !== 'closed') body.push(h('div', { style: 'text-align:center;margin:4px 0 16px' },
      h('button', { class: 'btn plain', type: 'button', style: 'width:auto;display:inline-flex', onclick: async () => {
        const ok = await UI.ask({ title: 'Вопрос решён?', message: 'Закроем обращение. Если что-то понадобится — просто напишите снова.', buttons: [{ id: 'y', text: 'Да, закрыть' }] });
        if (ok && await UI.run(() => api(`/tickets/${id}/close`, 'POST'), 'Обращение закрыто') !== undefined) reload();
      } }, 'Вопрос решён')));
    body.push(UI.composer(t.status === 'closed' ? 'Написать снова' : 'Сообщение', async txt => {
      const r = await UI.run(() => api(`/tickets/${id}/messages`, 'POST', { text: txt }));
      if (r === undefined) return false;
      await reload(); return true;
    }));
    v.replaceChildren(...body);
    document.body.classList.add('has-composer');
    requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight));

  reload();
  return v;
}

/* Карточка реферальной программы в профиле. */
function referralCard(r) {
  const terms = [`${r.pct}% с оплат друга` + (r.months ? ` · ${r.months} мес.` : ''), r.welcome_rub ? `другу +${rub(r.welcome_rub)}` : null].filter(Boolean).join(' · ');
  const name = D.service_name || 'сервис';
  const how = () => UI.alert(
    'Как это работает\n\n1. Поделитесь своей ссылкой.\n2. Друг откроет бота по ссылке и пополнит баланс' + (r.welcome_rub ? ` — получит ${rub(r.welcome_rub)} на баланс после первой оплаты` : '') + '.\n' +
    `3. Вы получаете ${r.pct}% с каждого его пополнения` + (r.months ? ` в течение ${r.months} мес.` : '') + '.\n\nБонусы зачисляются на баланс и тратятся на серверы. Считаются только новые пользователи и реальные оплаты.');
  const shareText = `Арендую VPS в ${name}: сервер за пару минут, оплата картой или через СБП.` + (r.welcome_rub ? ` По моей ссылке — ${rub(r.welcome_rub)} на баланс после первой оплаты.` : '');
  const link = r.bot || r.web;
  const share = () => {
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(shareText);
    UI.haptic('light');
    try { if (UI.tg) return UI.tg.openTelegramLink(url); } catch (e) {}
    if (navigator.share) navigator.share({ text: shareText, url: link }).catch(() => {}); else UI.copy(link, 'Ссылка');
  };
  const pct = r.invited ? Math.max(4, Math.round(r.active / r.invited * 100)) : 0;
  const earned = h('b');
  UI.tween(earned, 0, Math.round(r.earned_rub), v => '+' + rub(v), 500);
  return h('div', { class: 'ref-card rise' },
    h('div', { class: 'head' }, h('span', { class: 'icon-tile', style: '--tile:#34D399' }, icon('users')),
      h('div', {}, h('b', {}, 'Пригласите друзей'), h('span', {}, terms)),
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Как это работает', onclick: how }, icon('info'))),
    h('div', { class: 'earned' }, earned, h('span', {}, 'заработано')),
    h('div', { class: 'bar' }, h('i', { style: `width:${pct}%` })),
    h('div', { class: 'cnt' }, r.invited ? `${r.active} ${UI.plural(r.active, 'активный', 'активных', 'активных')} из ${r.invited} ${UI.plural(r.invited, 'приглашённого', 'приглашённых', 'приглашённых')}` : 'Пока никого — поделитесь ссылкой'),
    h('div', { class: 'two' },
      h('button', { class: 'btn primary', type: 'button', onclick: share }, icon('share'), 'Telegram'),
      h('button', { class: 'btn', type: 'button', onclick: () => UI.copy(r.web || link, 'Ссылка') }, icon('link'), 'Ссылка')));
}

  const list = h('div', {}, group(null, [h('div', { class: 'skeleton' }), h('div', { class: 'skeleton' })]));
  api('/history').then(items => {
    if (!items.length) { list.replaceChildren(h('div', { class: 'empty' }, icon('clock'), h('b', {}, 'Операций пока нет'), 'Здесь появятся пополнения, покупки и продления.')); return; }
    const byDay = {};
    items.forEach(x => { const d = new Date(x.created).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }); (byDay[d] = byDay[d] || []).push(x); });
    list.replaceChildren(...Object.entries(byDay).map(([day, xs]) => group(day, xs.map(txRow))));
  }).catch(e => list.replaceChildren(h('div', { class: 'empty' }, icon('alert'), h('b', {}, 'Не удалось загрузить'), e.message)));
  return h('div', {}, UI.nav.backLink('Профиль'), h('h1', { class: 'large-title' }, 'История'), list);
}

// ───────── обновление ─────────
async function refresh() {
  try { await load(); } catch (e) { return; }
  if (tab !== 'new' || UI.nav.stack.length) UI.nav.refresh();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && D) refresh(); });
setInterval(() => { if (D && !document.hidden && !D.consent.needed && D.servers.some(s => s.status === 'provisioning') && tab === 'servers') refresh(); }, 10000);

(async () => {
  renderTabbar();
  UI.nav.mount(document.getElementById('root'), root);
  try { await load(); }
  catch (e) {
    document.getElementById('root').replaceChildren(h('div', { class: 'empty' }, icon('alert'), h('b', {}, 'Не удалось открыть кабинет'), e.message));
    return;
  }
  UI.nav.refresh();
  if (!D.consent.needed && !(D.subscription && D.subscription.needed)) {
    loadCatalog().catch(() => {});
    const q = new URLSearchParams(location.search);
    if (q.get('ticket')) { goTab('profile'); UI.nav.push(ticketsView); UI.nav.push(() => ticketView(+q.get('ticket'))); }
    else if (q.get('tickets')) { goTab('profile'); UI.nav.push(ticketsView); }
  }
})();
</script>
