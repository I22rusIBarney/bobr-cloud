services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////srv/data/bot.db
    volumes:
      - ./data:/srv/data
    expose:
      - "8080"

  caddy:   # автоматический HTTPS (Let's Encrypt). Замените bot.example.com в Caddyfile
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - bot

volumes:
  caddy_data:
